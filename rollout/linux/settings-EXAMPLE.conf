# SETTINGS FOR ONE SERVER.
#
# 1. Copy this file and rename the copy to  settings-<yourservername>.conf
#    (for example settings-myserver.conf). Keep it in this same folder.
#    If you run more than one server, make one settings file per server; the scripts will ask which to use.
# 2. Fill in the lines below. Keep the quotes. Lines starting with # are notes.
# 3. Do not share the finished file: it contains your database password.

# ---- Required -----------------------------------------------------------
SERVER_NAME="My Server"                 # any label; used in backup folder names
SERVER_DIR="/opt/eqemu"                 # the folder your server runs from (it has eqemu_config.json in it)
BACKUP_ROOT="/var/backups/spellbook"    # where backups are kept. A different disk is best.

DB_NAME="peq"                           # the database name from eqemu_config.json
DB_USER="eqemu"                         # the database user from eqemu_config.json
DB_PASS="password"                      # the database password from eqemu_config.json
DB_HOST="127.0.0.1"                     # usually leave as is
DB_PORT="3306"                          # usually leave as is

# ---- Needed by 2-install.sh -----------------------------------------------
SOURCE_DIR="/opt/eqemu-source"          # your server SOURCE folder (it has common/patches/rof2_limits.h in it)

# Build: easiest is to let the script build for you. Leave BUILD_COMMAND empty to build by hand instead.
BUILD_COMMAND=""                        # example: "make"
BUILD_OUTPUT_DIR=""                     # folder the build puts the programs in, example: "/opt/eqemu-source/build/bin"

# Which program files to back up, restore and copy after the build. Edit if yours differ.
PROGRAMS=(world zone ucs queryserv loginserver eqlaunch shared_memory export_client_files import_client_files hc)

# ---- Optional -------------------------------------------------------------
# The eqgame.exe your players use TODAY (a copy of it is fine). If set, 2-install.sh patches it with the
# 1440-slot spellbook patch (needs Node.js) and saves the result in the backup folder. Your 4GB patch
# (or lack of it) is kept as is. If it is not the stock RoF2 client plus at most the 4GB patch, the patch refuses.
CLIENT_SOURCE_EXE=""                    # example: "/var/www/patcher/files/eqgame.exe"

# Commands to stop and start your server. Leave empty and the scripts will ask you to do it by hand.
STOP_COMMAND=""                         # example: "systemctl stop eqemu"
START_COMMAND=""                        # example: "systemctl start eqemu"

# A folder where you put the client file for players (for example your patcher's files folder).
# If set (and CLIENT_SOURCE_EXE is set), 2-install.sh copies the new eqgame.exe there (keeping the old one as
# eqgame.exe.before-1440) and 3-rollback.sh puts the old one back.
CLIENT_STAGE_DIR=""                     # example: "/var/www/patcher/files"
